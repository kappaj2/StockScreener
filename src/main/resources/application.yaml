spring:
  application:
    name: stocklistener

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
      connect-timeout: 200ms

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma4:e4b
        options:
          temperature: 0.1   # low = deterministic JSON output
          format: json       # forces model to respond with JSON only

  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: 8000
  shutdown: graceful

massive:
  api-key: ${MASSIVE_API_KEY}
  symbols: AM.*
  cron:
    start: "0 0 4 * * MON-FRI"
    stop: "0 0 20 * * MON-FRI"
    zone: "America/New_York"
  window:
    start: "04:00"
    stop: "20:00"

# Filter stocks before we show interest. Bar must be at least 2 dollar and volume must be at least 50k
filter:
  min-close: 0.1
  min-volume: 500

patterns:
  breakout:
    stop: 0.9
    target: 1.05
    storeSignal: true
  invertedV:
    stop: -1.35
    target: 2.0
    storeSignal: false
  unsharpen:
    stop: 0.97
    target: 1.06
    storeSignal: false
  momentum:
    stop: 0.97                  # stop-loss multiplier (entry × stop)
    target: 1.06                # price target multiplier (entry × target)
    storeSignal: true           # emit confirmed signals to SignalStore
    high-score: 7               # minimum score for a HIGH_MOMENTUM signal (volume gate still applies)
    very-high-score: 10         # minimum score for a VERY_HIGH_MOMENTUM signal (volume gate still applies)
    rsi-strong-threshold: 60.0  # RSI level that awards the "strong momentum" bonus point

indicators:
  rsi:
    period: 14              # Wilder's RSI look-back period
    overbought: 70          # RSI ≥ this → overbought flag
    oversold: 30            # RSI ≤ this → oversold flag
  roc:
    period: 10              # look-back period for ROC calculation
    avg-window: 10          # rolling window for average-ROC (acceleration detection)
    surge-factor: 1.5       # current ROC must be ≥ avgROC × this to flag a surge
  macd:
    fast: 12                # fast EMA period
    slow: 26                # slow EMA period
    signal: 9               # signal-line EMA period
  linreg:
    period: 60              # number of bars in the regression window (≈ 1 trading hour)
    steep-threshold: 0.001  # min normalised slope (slope/meanClose) to classify as steep
    r2-threshold: 0.70      # min R² alongside positive slope to flag a strong trend
  volume:
    short-period: 60        # recent (short) window in bars (≈ 1 hour)
    long-period: 390        # baseline window in bars (≈ 1 full regular session)
    surge-threshold: 1.5    # short avg ≥ long avg × this → volume surge
    conviction-threshold: 2.0  # short avg ≥ long avg × this → strong conviction

ibkr:
  enabled: true                   # set true once TWS is running on port below
  host: 127.0.0.1
  port: 7496                     # live TWS = 7496, paper = 7497, IB Gateway live = 4001
  client-id: 2                   # must differ from any other connected client
  symbols:                       # comma-separated symbols to auto-subscribe on connect
                                 # e.g. "AAPL,TSLA,NVDA"  (leave blank to subscribe via REST)
  tape:
    max-ticks: 500               # rolling window depth per symbol

ollama:
  breakout:
    min-confidence: 70   # minimum Ollama confidence % to emit a signal

logging:
  level:
    ROOT: INFO
    za.co.sfh: DEBUG