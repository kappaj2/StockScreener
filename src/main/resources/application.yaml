spring:
  application:
    name: stocklistener

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
      connect-timeout: 200ms

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:8b #qwen3:8b
        options:
          temperature: 0.1   # low = deterministic JSON output
          format: json       # forces model to respond with JSON only

  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: 8000
  shutdown: graceful

massive:
  api-key: ${MASSIVE_API_KEY}
  symbols: AM.*
  cron:
    start: "0 0 4 * * MON-FRI"
    stop: "0 0 20 * * MON-FRI"
    zone: "America/New_York"
  window:
    start: "04:00"
    stop: "20:00"

# Filter stocks before we show interest. Bar must be at least 2 dollar and volume must be at least 50k
filter:
  min-close: 0.1
  min-volume: 500

patterns:
  breakout:
    stop: 0.9
    target: 1.05
    storeSignal: true
  invertedV:
    stop: -1.35
    target: 2.0
    storeSignal: false
  unsharpen:
    stop: 0.97
    target: 1.06
    storeSignal: false
  strongClimb:
    movePercentage: 5.0   # minimum % move from lowest-high to highest-high to qualify
    moveNumBars: 390       # number of bars to scan (390 = one regular trading session)
    storeSignal: false

ibkr:
  enabled: true                   # set true once TWS is running on port below
  host: 127.0.0.1
  port: 7496                     # live TWS = 7496, paper = 7497, IB Gateway live = 4001
  client-id: 2                   # must differ from any other connected client
  symbols:                       # comma-separated symbols to auto-subscribe on connect
                                 # e.g. "AAPL,TSLA,NVDA"  (leave blank to subscribe via REST)
  tape:
    max-ticks: 500               # rolling window depth per symbol

ollama:
  breakout:
    min-confidence: 70   # minimum Ollama confidence % to emit a signal

logging:
  level:
    ROOT: INFO
    za.co.sfh: DEBUG