
spring:
  application:
    name: stocklistener

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 200ms
      connect-timeout: 200ms

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:3306/stock
    username: stock
    password: stock
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: stock
        connection:
          provider_disable_autocommit: true
        jdbc:
          batch_size: 5
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        envers:
          audit_strategy: org.hibernate.envers.strategy.internal.ValidityAuditStrategy
          strategy: org.hibernate.envers.strategy.internal.ValidityAuditStrategy
        query:
          plan_cache_max_size: 8192
          in_clause_parameter_padding: true
          fail_on_pagination_over_collection_fetch: true
        format_sql: false
        generate_statistics: false
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: "400"
  flyway:
    enabled: true
    password: stock
    user: stock
    schemas: stock
    url: jdbc:mariadb://${DB_HOST:localhost}:3306/stock?useUnicode=true&characterEncoding=utf8&useSSL=false&zeroDateTimeBehavior=convertToNull
    driver-class-name: org.mariadb.jdbc.Driver
    locations:
      - classpath:db/migration/schema
      - classpath:db/migration/procedures
    postgresql:
      transactional-lock: false # not relevant for mariadb but good practice if switching
    mysql:
      jdbc-properties:
        useAffectedRows: true

  ai:
    ollama:
      base-url: http://${OLLAMA_HOST:localhost}:11434
      chat:
        model: gemma4:e4b
        options:
          temperature: 0.1   # low = deterministic JSON output
          format: json       # forces model to respond with JSON only

  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: 8000
  shutdown: graceful

cron:
  purge:
    minute-bar: "0 0 2 * * *"
  partition:
    add-next: "0 0 2 * * *"
  daily-summary:
    run: "0 0 8 * * MON-SAT"   # 08:00 ET weekdays + Saturday (covers Friday's data)

massive:
  enabled: true
  api-key: ${MASSIVE_API_KEY}
  symbols: AM.*
  cron:
    start: "0 0 10 * * MON-FRI"
    stop: "0 0 2 * * TUE-SAT"
    zone: "Africa/Johannesburg"
  window:
    start: "10:00"
    stop: "02:00"
  retry:
    initial-delay-seconds: 5
    max-delay-seconds: 60
    max-attempts: 0   # 0 = unlimited retries within the trading window

# Filter stocks before we show interest.
# Price: $2–$150. Volume: per-bar >= 500, running daily avg per minute >= 20 000.
filter:
  min-close: 2.0
  max-close: 150.0
  min-volume: 500
  min-avg-daily-volume: 20000

patterns:
  breakout:
    stop: 0.9
    target: 1.05
    storeSignal: true
  invertedV:
    stop: -1.35
    target: 2.0
    storeSignal: false
  unsharpen:
    stop: 0.97
    target: 1.06
    storeSignal: false
  dont-diddle:
    percentage: 30    # suppress signals whose entry is within the middle X% of yesterday's range
  momentum:
    stop: 0.97                  # stop-loss multiplier (entry × stop)
    target: 1.06                # price target multiplier (entry × target)
    storeSignal: true           # emit confirmed signals to SignalStore
    high-score: 7               # minimum score for a HIGH_MOMENTUM signal (volume gate still applies)
    very-high-score: 10         # minimum score for a VERY_HIGH_MOMENTUM signal (volume gate still applies)
    rsi-strong-threshold: 60.0  # RSI level that awards the "strong momentum" bonus point
    ollama-enabled: false        # set true to re-enable Ollama second-opinion calls
    min-volume: 30000           # ignore bars with volume below this (small-cap noise filter)
    min-pct-change: 5.0         # minimum % price change over pct-change-bars to confirm momentum
    pct-change-bars: 5          # look-back window (bars) for the % change gate

indicators:
  rsi:
    period: 14              # Wilder's RSI look-back period
    overbought: 70          # RSI ≥ this → overbought flag
    oversold: 30            # RSI ≤ this → oversold flag
  roc:
    period: 10              # look-back period for ROC calculation
    avg-window: 10          # rolling window for average-ROC (acceleration detection)
    surge-factor: 1.5       # current ROC must be ≥ avgROC × this to flag a surge
  macd:
    fast: 12                # fast EMA period
    slow: 26                # slow EMA period
    signal: 9               # signal-line EMA period
  linreg:
    period: 60              # number of bars in the regression window (≈ 1 trading hour)
    steep-threshold: 0.001  # min normalised slope (slope/meanClose) to classify as steep
    r2-threshold: 0.70      # min R² alongside positive slope to flag a strong trend
  volume:
    short-period: 60        # recent (short) window in bars (≈ 1 hour)
    long-period: 390        # baseline window in bars (≈ 1 full regular session)
    surge-threshold: 1.5    # short avg ≥ long avg × this → volume surge
    conviction-threshold: 2.0  # short avg ≥ long avg × this → strong conviction

ibkr:
  enabled: true                   # set true once TWS is running on port below
  host: 127.0.0.1
  port: 7496                     # live TWS = 7496, paper = 7497, IB Gateway live = 4001
  client-id: 2                   # must differ from any other connected client
  symbols:                       # comma-separated symbols to auto-subscribe on connect
                                 # e.g. "AAPL,TSLA,NVDA"  (leave blank to subscribe via REST)
  tape:
    max-ticks: 500               # rolling window depth per symbol

ollama:
  breakout:
    min-confidence: 70   # minimum Ollama confidence % to emit a signal

logging:
  level:
    ROOT: INFO
    za.co.sfh: DEBUG