<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Trade Journal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <style>
    body { background: #0d1117; color: #e6edf3; }
    .navbar { background: #161b22; border-bottom: 1px solid #21262d; }
    .navbar-brand { color: #e6edf3 !important; font-weight: 600; }
    .nav-link { color: #8b949e !important; }
    .nav-link:hover { color: #e6edf3 !important; }
    .card { background: #161b22; border: 1px solid #21262d; }
    .card-header { background: #161b22; border-bottom: 1px solid #21262d; color: #7ee787; font-weight: 600; }
    .form-label { color: #7ee787; font-size: 0.85rem; margin-bottom: 2px; }
    .form-control, .form-select {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #e6edf3;
    }
    .form-control:focus, .form-select:focus {
      background: #0d1117;
      border-color: #58a6ff;
      color: #e6edf3;
      box-shadow: 0 0 0 2px rgba(88,166,255,0.2);
    }
    .form-control::placeholder { color: #484f58; }
    .form-check-input { background-color: #0d1117; border-color: #30363d; }
    .form-check-input:checked { background-color: #238636; border-color: #238636; }
    .form-check-label { color: #e6edf3; }
    .btn-save { background: #238636; border-color: #238636; color: #fff; }
    .btn-save:hover { background: #2ea043; border-color: #2ea043; color: #fff; }
    .btn-cancel { background: transparent; border-color: #30363d; color: #8b949e; }
    .btn-cancel:hover { border-color: #8b949e; color: #e6edf3; }
    table { color: #e6edf3; }
    thead th { background: #161b22; color: #8b949e; border-color: #21262d; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    tbody tr { border-color: #21262d; }
    tbody tr:nth-child(odd) td { background: #0d1117; }
    tbody tr:nth-child(even) td { background: #161b22; }
    tbody tr:hover td { background: #1c2128 !important; }
    td { border-color: #21262d !important; font-size: 0.85rem; vertical-align: middle; }
    .badge-long { background: #1a4731; color: #3fb950; }
    .badge-short { background: #4d1c20; color: #ff7b72; }
    .badge-open { background: #3d2b00; color: #ffa657; }
    .pnl-pos { color: #3fb950; font-weight: 600; }
    .pnl-neg { color: #ff7b72; font-weight: 600; }
    .alert-saved { background: #1a4731; border-color: #238636; color: #3fb950; }
    .edit-id { display: none; }
    /* Flatpickr dark theme */
    .flatpickr-calendar { background: #161b22; border: 1px solid #30363d; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
    .flatpickr-months { background: #161b22; border-bottom: 1px solid #21262d; }
    .flatpickr-month, .flatpickr-current-month, .flatpickr-monthDropdown-months { background: transparent; color: #e6edf3; }
    .flatpickr-monthDropdown-months { background: #161b22; }
    .flatpickr-prev-month, .flatpickr-next-month { color: #8b949e !important; fill: #8b949e !important; }
    .flatpickr-prev-month:hover, .flatpickr-next-month:hover { color: #e6edf3 !important; fill: #e6edf3 !important; }
    .flatpickr-weekdays { background: #161b22; }
    span.flatpickr-weekday { background: transparent; color: #7ee787; font-weight: 600; }
    .flatpickr-days { border-color: #21262d; }
    .flatpickr-day { color: #e6edf3; border-radius: 4px; }
    .flatpickr-day:hover { background: #1c2128; border-color: #30363d; }
    .flatpickr-day.today { border-color: #58a6ff; }
    .flatpickr-day.today:hover { background: #1c2128; }
    .flatpickr-day.selected, .flatpickr-day.selected:hover { background: #238636; border-color: #238636; color: #fff; }
    .flatpickr-day.flatpickr-disabled, .flatpickr-day.prevMonthDay, .flatpickr-day.nextMonthDay { color: #484f58; }
    .numInputWrapper span { border-color: #30363d; }
    .numInputWrapper span:hover { background: #1c2128; }
    .numInputWrapper input { color: #e6edf3; }
    /* Dark tooltips */
    .tooltip .tooltip-inner { background: #1c2128; color: #7ee787; border: 1px solid #30363d; font-size: 0.8rem; max-width: 260px; }
    .tooltip .tooltip-arrow::before { border-top-color: #30363d; }
  </style>
</head>
<body>

<nav class="navbar px-4 py-2">
  <span class="navbar-brand">Trade Journal</span>
  <div class="d-flex gap-3">
    <a href="/" class="nav-link">Signals</a>
    <a href="/institutions" class="nav-link">Institutional</a>
  </div>
</nav>

<div class="container-fluid px-4 py-3">

  <div th:if="${saved}" class="alert alert-saved mb-3">Trade saved successfully.</div>

  <!-- Form card -->
  <div class="card mb-4">
    <div class="card-header">Log a Trade</div>
    <div class="card-body">
      <form th:action="@{/journal/save}" th:object="${form}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="row g-2 mb-2">
          <div class="col-6 col-md-2">
            <label class="form-label" data-bs-toggle="tooltip" title="The date the trade was taken (New York time).">Date</label>
            <input type="date" th:field="*{tradeDate}" class="form-control form-control-sm" required/>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label" data-bs-toggle="tooltip" title="The ticker symbol — e.g. AAPL, SPY, QQQ.">Ticker</label>
            <input type="text" th:field="*{ticker}" class="form-control form-control-sm" placeholder="e.g. AAPL" required/>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label" data-bs-toggle="tooltip" title="LONG if you bought expecting price to rise; SHORT if you sold expecting it to fall.">Direction</label>
            <select th:field="*{direction}" class="form-select form-select-sm" required>
              <option th:each="d : ${directions}" th:value="${d}" th:text="${d.name()}"
                      th:selected="${d == form.direction}"></option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label" data-bs-toggle="tooltip" title="The price at which you entered the trade.">Entry</label>
            <input type="number" th:field="*{entryPrice}" class="form-control form-control-sm" step="0.01" min="0" required/>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label" data-bs-toggle="tooltip" title="Your stop-loss level — the price where you exit to cap the loss.">Stop</label>
            <input type="number" th:field="*{stopPrice}" class="form-control form-control-sm" step="0.01" min="0" required/>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label" data-bs-toggle="tooltip" title="The price at which you exited. Leave blank if the trade is still open.">Exit (optional)</label>
            <input type="number" th:field="*{exitPrice}" class="form-control form-control-sm" step="0.01" min="0"/>
          </div>
        </div>

        <div class="row g-2 mb-2">
          <div class="col-6 col-md-2">
            <label class="form-label" data-bs-toggle="tooltip" title="The pattern or setup that triggered the trade. Choose Other for a free-text description.">Setup</label>
            <select th:field="*{setup}" class="form-select form-select-sm" required>
              <option value="">Select...</option>
              <option th:each="s : ${setups}" th:value="${s}" th:text="${s}"
                      th:selected="${s == form.setup}"></option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label" data-bs-toggle="tooltip" title="The chart timeframe you used to identify and time the trade.">Timeframe</label>
            <select th:field="*{timeframe}" class="form-select form-select-sm">
              <option value="">Select...</option>
              <option th:each="tf : ${timeframes}" th:value="${tf}" th:text="${tf}"
                      th:selected="${tf == form.timeframe}"></option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label" data-bs-toggle="tooltip" title="The market condition during the trade — Trending, Choppy, Newsy, Gap Day, etc.">Cycle Context</label>
            <select th:field="*{cycleContext}" class="form-select form-select-sm">
              <option value="">Select...</option>
              <option th:each="cc : ${cycleContexts}" th:value="${cc}" th:text="${cc.label}"
                      th:selected="${cc == form.cycleContext}"></option>
            </select>
          </div>
          <div class="col-6 col-md-4">
            <label class="form-label" data-bs-toggle="tooltip" title="Optional link to a chart screenshot — TradingView share URL or image host.">Screenshot URL</label>
            <input type="url" th:field="*{screenshotUrl}" class="form-control form-control-sm" placeholder="https://..."/>
          </div>
          <div class="col-6 col-md-2 d-flex align-items-end pb-1">
            <div class="form-check">
              <input type="checkbox" th:field="*{followedPlan}" class="form-check-input" id="followedPlan"/>
              <label class="form-check-label" for="followedPlan" data-bs-toggle="tooltip"
                     title="Did you follow your trading plan? Honest tracking here is where improvement starts.">Followed Plan?</label>
            </div>
          </div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <label class="form-label" data-bs-toggle="tooltip" title="1-2 lines on what you executed well — entry timing, sizing, patience, etc.">What Went Well</label>
            <textarea th:field="*{whatWentWell}" class="form-control form-control-sm" rows="2" maxlength="1000" placeholder="1-2 lines..."></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label" data-bs-toggle="tooltip" title="The single most important thing you would do differently next time.">What to Improve</label>
            <textarea th:field="*{whatToImprove}" class="form-control form-control-sm" rows="2" maxlength="1000" placeholder="1-2 lines..."></textarea>
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-sm btn-save">Save Trade</button>
          <a href="/journal" class="btn btn-sm btn-cancel">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <div class="card-body p-0">
      <table class="table table-sm mb-0">
        <thead>
          <tr>
            <th>Date</th><th>Ticker</th><th>Dir</th><th>Entry</th><th>Stop</th>
            <th>Exit</th><th>P&amp;L %</th><th>Setup</th><th>TF</th><th>Context</th>
            <th>Plan?</th><th>Chart</th><th>Went Well</th><th>Improve</th><th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(entries)}">
            <td colspan="15" class="text-center py-4" style="color:#484f58;">No trades logged yet.</td>
          </tr>
          <tr th:each="e : ${entries}">
            <td th:text="${e.tradeDate}" style="white-space:nowrap;"></td>
            <td><strong th:text="${e.ticker}" style="color:#e6edf3;"></strong></td>
            <td>
              <span th:classappend="${e.direction.name() == 'LONG'} ? 'badge badge-long' : 'badge badge-short'"
                    th:text="${e.direction.name()}"></span>
            </td>
            <td th:text="${#numbers.formatDecimal(e.entryPrice, 1, 2)}" style="color:#e6edf3;"></td>
            <td th:text="${#numbers.formatDecimal(e.stopPrice, 1, 2)}" style="color:#8b949e;"></td>
            <td th:text="${e.exitPrice != null} ? ${#numbers.formatDecimal(e.exitPrice, 1, 2)} : '-'" style="color:#e6edf3;"></td>
            <td>
              <span th:if="${e.exitPrice == null}" class="badge badge-open">OPEN</span>
              <span th:if="${e.exitPrice != null}">
                <span th:with="pnl=${e.direction.name() == 'LONG'}
                                    ? (e.exitPrice - e.entryPrice) / e.entryPrice * 100
                                    : (e.entryPrice - e.exitPrice) / e.entryPrice * 100"
                      th:classappend="${pnl >= 0} ? 'pnl-pos' : 'pnl-neg'"
                      th:text="${(pnl >= 0) ? '+' : ''} + ${#numbers.formatDecimal(pnl, 1, 2)} + '%'"></span>
              </span>
            </td>
            <td th:text="${e.setup}" style="color:#e6edf3;"></td>
            <td th:text="${e.timeframe != null} ? ${e.timeframe} : '-'" style="color:#8b949e;"></td>
            <td th:text="${e.cycleContext != null} ? ${e.cycleContext.label} : '-'" style="color:#8b949e;"></td>
            <td>
              <span th:if="${e.followedPlan == null}" style="color:#484f58;">-</span>
              <span th:if="${e.followedPlan != null}"
                    th:classappend="${e.followedPlan} ? 'pnl-pos' : 'pnl-neg'"
                    th:text="${e.followedPlan} ? 'Yes' : 'No'"></span>
            </td>
            <!-- Screenshot thumbnail — clicking opens full image in new tab -->
            <td>
              <span th:if="${e.screenshotUrl == null or e.screenshotUrl.isBlank()}" style="color:#484f58;">—</span>
              <a th:if="${e.screenshotUrl != null and !e.screenshotUrl.isBlank()}"
                 th:href="${e.screenshotUrl}" target="_blank" rel="noopener">
                <img th:src="${e.screenshotUrl}" alt="chart"
                     style="height:40px; width:64px; object-fit:cover; border-radius:3px; border:1px solid #30363d; cursor:pointer;"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';"/>
                <span style="display:none; color:#58a6ff; font-size:0.75rem;">View</span>
              </a>
            </td>
            <td style="max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#e6edf3;"
                th:title="${e.whatWentWell}"
                th:text="${e.whatWentWell != null} ? ${e.whatWentWell} : ''"></td>
            <td style="max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#e6edf3;"
                th:title="${e.whatToImprove}"
                th:text="${e.whatToImprove != null} ? ${e.whatToImprove} : ''"></td>
            <td class="text-nowrap">
              <a th:href="@{/journal/edit/{id}(id=${e.id})}" class="btn btn-sm btn-cancel py-0 px-2">Edit</a>
              <form th:action="@{/journal/delete/{id}(id=${e.id})}" method="post" class="d-inline"
                    onsubmit="return confirm('Delete this trade?')">
                <button type="submit" class="btn btn-sm py-0 px-2" style="color:#ff7b72; border-color:#30363d;">Delete</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
<script>
  flatpickr('#tradeDate', {
    dateFormat: 'Y-m-d',
    allowInput: true
  });
  document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el =>
    new bootstrap.Tooltip(el, { trigger: 'hover', placement: 'top' })
  );
</script>
</body>
</html>
