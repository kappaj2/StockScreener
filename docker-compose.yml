services:

  # ── Infrastructure ────────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: stock
      MARIADB_USER: stock
      MARIADB_PASSWORD: ${DB_PASSWORD:-stock}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Stocklistener: live recording mode ────────────────────────────────────────
  # Connects to Polygon.io, records every raw WebSocket message to a dated .jsonl
  # fixture file on the host. Run with:
  #   MASSIVE_API_KEY=<key> docker compose up recorder
  recorder:
    image: stocklistener:latest
    build: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8085:8000"
    environment:
      MASSIVE_API_KEY: ${MASSIVE_API_KEY}
      DB_HOST: mariadb
      SPRING_PROFILES_ACTIVE: record
      RECORDER_OUTPUT_DIR: /fixtures
      SPRING_AI_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_HOST: host.docker.internal
      VAADIN_PRODUCTIONMODE: "true"
      TZ: Africa/Johannesburg
    volumes:
      # Fixture files land directly in the test-resources directory so the IDE
      # replay test can read them without any copy step.
      - ./src/test/resources/fixtures:/fixtures
    extra_hosts:
      # Allows the container to reach Ollama (and Redis if run externally) on the
      # host machine. On Linux this is required; Mac/Windows have it built in.
      - "host.docker.internal:host-gateway"

  # ── Stocklistener: normal (non-recording) mode ───────────────────────────────
  # Use this profile for production-style runs without fixture capture.
  #   MASSIVE_API_KEY=<key> docker compose up app
  app:
    image: stocklistener:latest
    build: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8085:8000"
    environment:
      MASSIVE_API_KEY: ${MASSIVE_API_KEY}
      DB_HOST: mariadb
      SPRING_AI_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_HOST: host.docker.internal
      VAADIN_PRODUCTIONMODE: "true"
      TZ: Africa/Johannesburg
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mariadb_data:
